<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una carta para mi boo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#e4e9c8; --bg2:#cdd8a8; --ink:#5b4a1e;
  --env:#fbf0cf; --env-back:#e9d495; --flap:#f4e2a6; --flap-in:#e3c46a;
  --gold:#e2a21a; --gold-d:#b97a0a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#2c3220; --bg2:#1d2216; --ink:#f1e2b4; }
}
:root[data-theme="dark"]{ --bg1:#2c3220; --bg2:#1d2216; --ink:#f1e2b4; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{
  margin:0;height:100%;height:100dvh;overflow:hidden;color:var(--ink);
  background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2));
  font-family:'Cormorant Garamond',Georgia,serif;
}
.page{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;padding:1rem}
h1{font-family:'Great Vibes','Snell Roundhand',cursive;font-weight:400;font-size:clamp(2.6rem,9vw,4rem);margin:0;line-height:1}

.stage{
  --w:min(90vw,440px,calc((100dvh - 11rem)/.68));
  position:relative;width:var(--w);height:calc(var(--w)*.68);
  perspective:1100px;cursor:pointer;touch-action:manipulation;
  filter:drop-shadow(0 18px 24px rgba(70,50,10,.28));
  -webkit-tap-highlight-color:transparent;
}
.back{position:absolute;inset:0;background:var(--env-back);border-radius:8px;z-index:0}
.front{
  position:absolute;inset:0;z-index:3;background:var(--env);border-radius:8px;
  clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);
}
.flap{
  position:absolute;left:0;top:0;width:100%;height:58%;z-index:4;
  background:var(--flap);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:50% 0;transition:transform .75s ease,background .75s ease,z-index 0s .35s;
}
.stage.open .flap{transform:rotateX(180deg);background:var(--flap-in);z-index:1}
.seal{
  position:absolute;left:50%;top:58%;z-index:5;width:3.1rem;height:3.1rem;margin:-1.55rem 0 0 -1.55rem;
  border-radius:50%;display:grid;place-items:center;font-size:1.5rem;
  background:radial-gradient(circle at 35% 30%,#f6c849,var(--gold) 60%,var(--gold-d));
  box-shadow:0 3px 6px rgba(80,50,0,.4);transition:opacity .3s;
}
.stage.open .seal{opacity:0}

.letter{
  position:absolute;z-index:2;left:10%;width:80%;aspect-ratio:8.5/11;bottom:-12%;
  transform:scale(.5);transition:transform 1.2s cubic-bezier(.22,.8,.24,1);
}
.paper{width:100%;height:100%;background:#fffdf4;border-radius:3px;overflow:hidden;box-shadow:0 6px 18px rgba(60,40,0,.3);display:grid;place-items:center;text-align:center}
.paper img{width:100%;height:100%;object-fit:cover;display:block}
#ph{font-size:3rem;padding:1rem;line-height:1.1}
#ph p{font-size:1.1rem;margin:.4rem 0 0;color:#7a6530}

.stage.read .back,.stage.read .front,.stage.read .flap,.stage.read .seal{opacity:0;transition:opacity .8s .5s}
.stage.read{cursor:default;filter:none}

.hint{margin:0;font-style:italic;font-size:1.25rem;transition:opacity .4s;animation:pulse 2.4s ease-in-out infinite}
.hint.gone{opacity:0;animation:none}
@keyframes pulse{50%{opacity:.45}}

.btn{
  font:inherit;font-size:1.1rem;color:var(--ink);background:transparent;cursor:pointer;
  border:1.5px solid currentColor;border-radius:999px;padding:.45rem 1.2rem;
}
.btn:focus-visible,.pick:focus-within{outline:3px solid var(--gold);outline-offset:3px}
#again{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;
  background:var(--bg2)}
.pick{position:fixed;top:calc(.8rem + env(safe-area-inset-top,0px));right:.8rem;z-index:30;border-radius:999px}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick span{display:inline-block}
@media (max-height:520px){h1{display:none}.page{gap:.8rem}.hint{font-size:1.05rem}}
@media (max-width:380px){.hint{font-size:1.1rem}h1{font-size:2.4rem}}
@media (prefers-reduced-motion:reduce){
  .letter,.flap{transition-duration:.01s}.hint{animation:none}
}
</style>
</head>

<button class="btn" id="again" hidden>Cerrar el sobre</button>

<script>
(function(){
  var stage=document.getElementById('stage'),letter=document.getElementById('letter'),
      hint=document.getElementById('hint'),again=document.getElementById('again'),
      title=document.getElementById('title'),img=document.getElementById('img');
  var state='closed',timers=[];
  function later(fn,ms){timers.push(setTimeout(fn,ms));}


  function open(){
    if(state!=='closed')return; state='opening';
    stage.classList.add('open'); hint.classList.add('gone');
    later(function(){
      var w=stage.offsetWidth;
      letter.style.transform='translateY('+(-0.5*w)+'px) scale(.5)';
    },650);
    later(read,1900);
  }
  function fit(){
    var sr=stage.getBoundingClientRect();
    var lw=letter.offsetWidth,lh=letter.offsetHeight;
    var cx=sr.left+letter.offsetLeft+lw/2, cy=sr.top+letter.offsetTop+lh/2;
    var dx=innerWidth/2-cx, dy=innerHeight/2-cy;
    var s=Math.min(innerWidth*.94/lw,(innerHeight-70)*.94/lh);
    letter.style.transform='translate('+dx+'px,'+dy+'px) scale('+s+')';
  }
  function read(){
    letter.style.zIndex=10; fit();
    stage.classList.add('read'); title.style.opacity=0; title.style.transition='opacity .6s';
    state='reading';
    later(function(){again.hidden=false;},1300);
  }
  function close(){
    timers.forEach(clearTimeout);timers=[];
    again.hidden=true; letter.style.transform=''; stage.classList.remove('read');
    title.style.opacity=1;
    later(function(){
      stage.classList.remove('open'); letter.style.zIndex='';
      hint.classList.remove('gone'); state='closed';
    },900);
  }
  stage.addEventListener('click',open);
  stage.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  again.addEventListener('click',close);
  addEventListener('resize',function(){
    if(state==='reading'){letter.style.transition='none';fit();void letter.offsetWidth;letter.style.transition='';}
  });
})();
</script>
